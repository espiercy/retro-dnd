name: CI

"on":
  push:
  pull_request:

jobs:
  verify:
    # Single pinned environment, no version matrix -- docs/technical/TOOLCHAIN_AND_CI.md §9.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies (locked)
        run: uv sync --locked --group dev

      # This must be the exact same command a developer runs locally --
      # CI never maintains a separately defined set of checks
      # (docs/technical/TOOLCHAIN_AND_CI.md §9).
      - name: Run canonical verification
        run: uv run python scripts/verify.py
