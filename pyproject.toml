[project]
name = "retro-dnd-simulator"
version = "0.1.0"
description = "A historically faithful simulator of the original 1974 Dungeons & Dragons game."
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# This is an application, not a distributable library: uv should manage the
# dependency environment without trying to build/install this project itself
# as a package (docs/technical/TOOLCHAIN_AND_CI.md §7).
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
mypy_path = "src"
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
